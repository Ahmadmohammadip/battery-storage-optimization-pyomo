name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The model is a pure LP, so HiGHS via the highspy wheel is the only
      # solver needed — no conda, no Ipopt.
      - name: Install package
        run: pip install -e ".[dev,solvers,viz]"

      - name: Lint with ruff
        run: ruff check src tests app data

      - name: Run tests
        run: pytest -v

      - name: Streamlit app syntax smoke test
        run: python -m py_compile app/streamlit_app.py
